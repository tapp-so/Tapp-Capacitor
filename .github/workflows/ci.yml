name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Gradle runs on JDK 21 while the plugin compiles to Java 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test Android
        working-directory: android
        # assembleRelease runs checkReleaseAarMetadata on AGP 8.13, but older AGP (e.g. 8.2.1)
        # only checks dependency AAR metadata (minimum AGP / compileSdk) for library modules
        # through the androidTest variant, so that task is listed explicitly as well.
        run: ./gradlew :testDebugUnitTest :assembleRelease :lintDebug :checkDebugAndroidTestAarMetadata --stacktrace

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          xcodebuild -list
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          export SIMULATOR_SDK_VERSION
          xcrun simctl list devices available -j | python3 -c '
          import json
          import os
          import re
          import sys

          def version_tuple(value):
              parts = tuple(int(part) for part in re.split(r"[.-]", value))
              return parts + (0,) * (3 - len(parts))

          sdk_version = version_tuple(os.environ["SIMULATOR_SDK_VERSION"])
          runtimes = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+(?:-\d+)*)", runtime)
              if match:
                  version = tuple(int(part) for part in match.group(1).split("-"))
                  if version_tuple(match.group(1)) <= sdk_version:
                      runtimes.append((version, devices))

          for version, devices in sorted(runtimes, key=lambda item: item[0], reverse=True):
              iphones = [device for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")]
              if iphones:
                  device = iphones[0]
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("UDID=" + device["udid"] + "\n")
                  print("Selected " + device["name"] + " (iOS " + ".".join(map(str, version)) + ")")
                  break
          else:
              sys.exit("No available iPhone simulator compatible with the selected SDK found")
          '
      - name: Test iOS
        shell: bash
        run: xcodebuild test -scheme TappCapacitorSdk -destination "id=$UDID" -only-testing:TappCapacitorPluginTests
      - name: Build iOS
        run: xcodebuild build -scheme TappCapacitorSdk -destination generic/platform=iOS

  capacitor-peer-range:
    name: JS/types compatibility (Capacitor ${{ matrix.capacitor }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - capacitor: '6.0.0'
            spec: '6.0.0'
            major: 6
          - capacitor: '6'
            spec: '^6'
            major: 6
          - capacitor: '7'
            spec: '^7'
            major: 7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save "@capacitor/core@${{ matrix.spec }}"
        env:
          # Native development packages use v8; this matrix checks the JS core API.
          npm_config_legacy_peer_deps: 'true'
      - name: Verify installed @capacitor/core major
        env:
          EXPECTED_MAJOR: ${{ matrix.major }}
        run: |
          node -e '
          const version = require("@capacitor/core/package.json").version;
          console.log(version);
          if (Number(version.split(".")[0]) !== Number(process.env.EXPECTED_MAJOR)) {
            process.exit(1);
          }
          '
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
