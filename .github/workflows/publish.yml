name: Publish

# The first version is published manually (see RELEASING.md); this workflow publishes later versions.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: run all checks and `npm publish --dry-run` without publishing'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

# No macOS/iOS job here: iOS is covered by ci.yml on macOS, so ci.yml must be green (including iOS) before releasing.
jobs:
  publish:
    # Only publish from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1;
      # publishing with a dist-tag over OIDC needs npm >= 11.21.0.
      # node-version '22' matches ci.yml and resolves to the latest 22.x;
      # this check guards the minimum versions.
      - name: Use npm 11.21.0
        run: |
          npm install -g npm@11.21.0
          node -e '
          const { execFileSync } = require("node:child_process");
          function atLeast(actual, minimum) {
            const parts = actual.replace(/^v/, "").split(".").map(Number);
            const required = minimum.split(".").map(Number);
            for (let i = 0; i < 3; i++) {
              if (!Number.isInteger(parts[i])) return false;
              if (parts[i] !== required[i]) return parts[i] > required[i];
            }
            return true;
          }
          const npmVersion = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          for (const [name, actual, minimum] of [
            ["Node", process.version, "22.14.0"],
            ["npm", npmVersion, "11.21.0"]
          ]) {
            if (!atLeast(actual, minimum)) {
              console.error(name + " >= " + minimum + " is required; found " + actual);
              process.exit(1);
            }
            console.log(name + ": " + actual);
          }
          '
      - name: Require a prerelease matching the publish tag
        run: |
          node -e '
          const pkg = require("./package.json");
          const version = pkg.version;
          const tag = pkg.publishConfig && pkg.publishConfig.tag;
          const num = "(0|[1-9]\\d*)";
          const ident = "(?:0|[1-9]\\d*|\\d*[A-Za-z-][0-9A-Za-z-]*)";
          const re = new RegExp("^" + num + "\\." + num + "\\." + num +
            "(?:-(" + ident + "(?:\\." + ident + ")*))?(?:\\+([0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*))?$");
          const m = typeof version === "string" ? re.exec(version) : null;
          if (!m) {
            console.error("Version " + JSON.stringify(version) + " is not a valid SemVer 2.0 version. Refusing to publish.");
            process.exit(1);
          }
          const prerelease = m[4];
          console.log("version: " + version);
          console.log("prerelease: " + (prerelease || "(none)"));
          console.log("publishConfig.tag: " + (tag || "(missing)"));
          if (!prerelease) {
            console.error("Version " + version + " has no prerelease part (e.g. 0.1.0-alpha.0). Refusing to publish.");
            process.exit(1);
          }
          if (!tag) {
            console.error("publishConfig.tag is missing in package.json. Refusing to publish.");
            process.exit(1);
          }
          const first = prerelease.split(".")[0];
          if (first !== tag) {
            console.error("First prerelease identifier \"" + first + "\" does not match publishConfig.tag \"" + tag + "\". Refusing to publish.");
            process.exit(1);
          }
          '
      - name: Refuse an already-published version
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          set +e
          LOOKUP_OUTPUT=$(npm view "$NAME@$VERSION" version --json)
          LOOKUP_STATUS=$?
          set -e
          export NAME VERSION LOOKUP_OUTPUT LOOKUP_STATUS
          node -e '
          const { NAME, VERSION, LOOKUP_OUTPUT, LOOKUP_STATUS } = process.env;
          const output = LOOKUP_OUTPUT.trim();
          const status = Number(LOOKUP_STATUS);
          let result;
          try { result = JSON.parse(output); } catch { /* Fail closed below. */ }
          if (status === 0 && result === VERSION) {
            console.error(NAME + "@" + VERSION + " is already published. Refusing to publish.");
            process.exit(1);
          }
          if (status !== 0 && result && result.error && result.error.code === "E404") {
            console.log(NAME + "@" + VERSION + " is not published.");
            process.exit(0);
          }
          console.error("Could not check the published version (exit " + status + "). Refusing to publish.");
          console.error(LOOKUP_OUTPUT);
          process.exit(1);
          '
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        # The log may say "tag latest"; the real publish uses publishConfig.tag.
        run: npm publish --dry-run
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        # Authenticates with npm trusted publishing (OIDC via id-token: write), no token.
        # Provenance is generated automatically; publishConfig.provenance stays true.
        # Tag (alpha) and access come from publishConfig in package.json.
        # The npm trusted publisher must allow npm publish for publish.yml + environment npm-publish.
        # The prepack script builds dist/ during publish.
        run: npm publish
